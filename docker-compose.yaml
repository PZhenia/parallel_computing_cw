services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    entrypoint:
      - /bin/sh
      - -c
      - >
        /bin/ollama serve &
        pid=$$!;
        trap 'kill -TERM $$pid; wait $$pid' TERM INT;
        until /bin/ollama list > /dev/null 2>&1; do sleep 1; done;
        /bin/ollama list | grep -q "llama3.2:1b" || /bin/ollama pull llama3.2:1b;
        echo "Ollama model llama3.2:1b is ready.";
        wait $$pid

  search-server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: search-server
    ports:
      - "8080:8080"
    depends_on:
      - ollama
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - SEARCH_DATASET_PATH=/app/data/batched
      - ASPNETCORE_URLS=http://+:8080
    volumes:
      - ./data/batched:/app/data/batched

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    container_name: grocery-frontend
    ports:
      - "5173:80"
    depends_on:
      - search-server

volumes:
  ollama-data:
